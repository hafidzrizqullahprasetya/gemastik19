<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifin — Video Rancangan Perangkat Lunak | GEMASTIK XIX 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- ─── Phosphor Icons Family ──────────────────────────────────────────────── -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css" />

<style>
/* ─── Verifin-App Authentic Tokens ─────────────────────────────────────────── */
:root {
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Universal 1.5 Line-Height Standard */
  --line-height-std: 1.5;

  /* Ultra-Silky Smooth Easing (Slower & Luxurious) */
  --ease-slider: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-stagger: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ─── Light Theme (Exact Verifin-App Cream Palette) ───────────────────────── */
.slide.theme-light {
  --bg: #faf8f4;
  --bg-elevated: #ffffff;
  --bg-subtle: #f2ede6;
  --bg-muted: #e8e2d9;
  --bg-card: #ffffff;
  --bg-card-hover: #ffffff;

  --border: rgba(44, 40, 37, 0.10);
  --border-strong: rgba(44, 40, 37, 0.24);

  --text: #2c2825;
  --text-primary: #2c2825;
  --text-secondary: #4a4540;
  --text-dim: #4a4540;
  --text-muted: #8a8279;

  --accent: #2c2825;

  --aman-bg: #edf3ec;
  --aman-fg: #2f5c34;
  --aman-border: rgba(47, 92, 52, 0.20);

  --waspada-bg: #fbf4db;
  --waspada-fg: #7a5500;
  --waspada-border: rgba(122, 85, 0, 0.20);

  --bahaya-bg: #fdebec;
  --bahaya-fg: #8f2f2d;
  --bahaya-border: rgba(143, 47, 45, 0.20);

  --shadow-card: 0 1px 3px rgba(44, 40, 37, 0.04), 0 4px 14px rgba(44, 40, 37, 0.03);
  --shadow-hover: 0 2px 6px rgba(44, 40, 37, 0.06), 0 8px 24px rgba(44, 40, 37, 0.05);
  --tbl-header-bg: #2c2825;
  --tbl-header-text: #faf8f4;
  --tbl-row-alt: #f8f5f0;
  --tbl-border: rgba(44, 40, 37, 0.09);
  --badge-bg: #f2ede6;
}

/* ─── Dark Theme (Inverted Charcoal & Warm Espresso) ──────────────────────── */
.slide.theme-dark {
  --bg: #161413;
  --bg-elevated: #23201d;
  --bg-subtle: #1e1b19;
  --bg-muted: #302c28;
  --bg-card: #201d1a;
  --bg-card-hover: #26221f;

  --border: rgba(250, 248, 244, 0.11);
  --border-strong: rgba(250, 248, 244, 0.24);

  --text: #faf8f4;
  --text-primary: #faf8f4;
  --text-secondary: #d6cfc7;
  --text-dim: #d6cfc7;
  --text-muted: #9e968b;

  --accent: #faf8f4;

  --aman-bg: rgba(47, 92, 52, 0.28);
  --aman-fg: #86efac;
  --aman-border: rgba(134, 239, 172, 0.28);

  --waspada-bg: rgba(122, 85, 0, 0.28);
  --waspada-fg: #fde047;
  --waspada-border: rgba(253, 224, 71, 0.28);

  --bahaya-bg: rgba(143, 47, 45, 0.28);
  --bahaya-fg: #fca5a5;
  --bahaya-border: rgba(252, 165, 165, 0.28);

  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.2);
  --shadow-hover: 0 2px 8px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.3);
  --tbl-header-bg: #23201d;
  --tbl-header-text: #faf8f4;
  --tbl-row-alt: rgba(255, 255, 255, 0.025);
  --tbl-border: rgba(250, 248, 244, 0.10);
  --badge-bg: rgba(250, 248, 244, 0.07);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: var(--font-main);
  line-height: var(--line-height-std);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  background: #161413;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ─── Particles Canvas ────────────────────────────────────────────────────── */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

/* ─── Silky Smooth Slider Deck Track ──────────────────────────────────────── */
.deck-viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  overflow: hidden;
}
.slider-track {
  display: flex;
  height: 100%;
  transition: transform 1.15s var(--ease-slider);
  will-change: transform;
  transform: translate3d(0, 0, 0);
}
.slide {
  width: 100vw;
  height: 100vh;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.6rem 5.4rem 5.8rem;
  background: var(--bg);
  color: var(--text);
  position: relative;
  overflow: hidden;
  line-height: var(--line-height-std);
}

/* ─── Staggered Micro Animations Per Slide ─── */
@keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDownFade { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideLeftFade { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideRightFade { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes scalePopIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
@keyframes growBarV { from { height: 0%; } }
@keyframes growBarH { from { width: 0%; } }

.slide.active .a-up { animation: slideUpFade 0.75s var(--ease-stagger) both; }
.slide.active .a-down { animation: slideDownFade 0.75s var(--ease-stagger) both; }
.slide.active .a-left { animation: slideLeftFade 0.75s var(--ease-stagger) both; }
.slide.active .a-right { animation: slideRightFade 0.75s var(--ease-stagger) both; }
.slide.active .a-pop { animation: scalePopIn 0.75s var(--ease-stagger) both; }

.d-0 { animation-delay: 0.08s !important; }
.d-1 { animation-delay: 0.18s !important; }
.d-2 { animation-delay: 0.28s !important; }
.d-3 { animation-delay: 0.38s !important; }
.d-4 { animation-delay: 0.48s !important; }
.d-5 { animation-delay: 0.58s !important; }
.d-6 { animation-delay: 0.68s !important; }

/* ─── Typography & 1.5 Spacing Standard ───────────────────────────────────── */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.4rem 1.1rem;
  background: var(--badge-bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  line-height: var(--line-height-std);
}
.eyebrow i { font-size: 15px; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 1.18;
  color: var(--text);
  letter-spacing: -0.03em;
}
h1 { font-size: 4.6rem; }
h2 { font-size: 2.65rem; }
h3 { font-size: 1.45rem; }
h4 { font-size: 1.15rem; }

p { font-size: 1.05rem; line-height: var(--line-height-std); color: var(--text-dim); }
.lead { font-size: 1.25rem; line-height: var(--line-height-std); color: var(--text-dim); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-muted); }
.center { text-align: center; }

/* ─── Big Numbers ─────────────────────────────────────────────────────────── */
.hero-num-huge {
  font-family: var(--font-display);
  font-size: 4.2rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
}

/* ─── Clean Glass Panels ──────────────────────────────────────────────────── */
.glass-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 1.5rem;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
  line-height: var(--line-height-std);
}
.glass-panel:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-hover);
}

/* ─── Speaker Tags ────────────────────────────────────────────────────────── */
.speaker-tag {
  position: absolute;
  top: 1.6rem;
  right: 2.8rem;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.45rem 1.25rem;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  box-shadow: var(--shadow-card);
  z-index: 10;
  line-height: var(--line-height-std);
}
.speaker-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.speaker-akmal { background: var(--aman-fg); }
.speaker-hafidz { background: var(--text); }
.speaker-matthew { background: var(--waspada-fg); }

/* ─── Verdict Badges ──────────────────────────────────────────────────────── */
.verdict-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.38rem 1rem;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border: 1px solid;
  line-height: var(--line-height-std);
}
.verdict-aman {
  background: var(--aman-bg);
  color: var(--aman-fg);
  border-color: var(--aman-border);
}
.verdict-waspada {
  background: var(--waspada-bg);
  color: var(--waspada-fg);
  border-color: var(--waspada-border);
}
.verdict-bahaya {
  background: var(--bahaya-bg);
  color: var(--bahaya-fg);
  border-color: var(--bahaya-border);
}

/* ─── Spacious Clean Tables (1.5 Line Height) ─────────────────────────────── */
.custom-table-wrap {
  width: 100%;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid var(--tbl-border);
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
}
.custom-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.custom-table th {
  background: var(--tbl-header-bg);
  color: var(--tbl-header-text);
  font-weight: 700;
  padding: 0.9rem 1.2rem;
  letter-spacing: 0.04em;
  font-size: 11.5px;
  text-transform: uppercase;
  line-height: var(--line-height-std);
}
.custom-table td {
  padding: 0.85rem 1.2rem;
  border-bottom: 1px solid var(--tbl-border);
  color: var(--text-dim);
  vertical-align: middle;
  line-height: var(--line-height-std);
}
.custom-table tr:nth-child(even) td { background: var(--tbl-row-alt); }
.custom-table tr:last-child td { border-bottom: none; }
.custom-table tr:hover td { background: var(--bg-card-hover); color: var(--text); }

/* ─── Bar Chart Vertical ──────────────────────────────────────────────────── */
.bar-chart-container {
  display: flex;
  align-items: flex-end;
  gap: 1.5rem;
  height: 160px;
  padding: 1.2rem 1.5rem 0.6rem;
  background: var(--bg-subtle);
  border-radius: 14px;
  border: 1px solid var(--border);
}
.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  height: 100%;
  justify-content: flex-end;
}
.bar-track {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  background: rgba(44, 40, 37, 0.06);
  border-radius: 8px 8px 0 0;
  overflow: hidden;
}
.bar-fill-elem {
  width: 100%;
  border-radius: 8px 8px 0 0;
  animation: growBarV 1.3s var(--ease-stagger) both;
}
.bar-label-txt { font-size: 12px; font-weight: 700; color: var(--text-muted); line-height: var(--line-height-std); }
.bar-val-txt { font-family: var(--font-mono); font-size: 12.5px; font-weight: 800; color: var(--text); line-height: var(--line-height-std); }

/* ─── Horizontal Bar Chart ────────────────────────────────────────────────── */
.hbar-item {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.hbar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  font-weight: 600;
  line-height: var(--line-height-std);
}
.hbar-track {
  width: 100%;
  height: 10px;
  background: var(--bg-subtle);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.hbar-fill {
  height: 100%;
  border-radius: 999px;
  animation: growBarH 1.3s var(--ease-stagger) both;
}

/* ─── Pipeline Flow ───────────────────────────────────────────────────────── */
.pipeline-flow {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  width: 100%;
  gap: 0.75rem;
}
.pipeline-step-node {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  text-align: center;
  padding: 1.25rem 1rem;
  border-radius: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  line-height: var(--line-height-std);
}
.pipeline-icon-circle {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 22px;
}
.pipeline-arrow-icon {
  color: var(--text-muted);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  opacity: 0.55;
  font-size: 18px;
}

/* ─── Mockup Window ───────────────────────────────────────────────────────── */
.mockup-window {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
}
.mockup-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1rem;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
}
.window-dot { width: 8px; height: 8px; border-radius: 50%; }
.window-url {
  flex: 1;
  margin: 0 0.8rem;
  padding: 0.3rem 0.8rem;
  background: var(--bg-card);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.45rem;
  border: 1px solid var(--border);
  line-height: var(--line-height-std);
}

/* ─── Bottom Navigation Bar ───────────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.8rem;
  background: rgba(22, 20, 19, 0.96);
  border-top: 1px solid rgba(250, 248, 244, 0.09);
  z-index: 100;
  color: #faf8f4;
  line-height: var(--line-height-std);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.nav-brand-logo {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #faf8f4;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #161413;
  font-size: 16px;
}
.nav-brand-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #faf8f4;
}
.nav-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.nav-counter {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: #d6cfc7;
  margin-right: 0.6rem;
}
.nav-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid rgba(250, 248, 244, 0.14);
  background: rgba(250, 248, 244, 0.07);
  color: #faf8f4;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 16px;
}
.nav-btn:hover:not(:disabled) {
  background: rgba(250, 248, 244, 0.18);
  border-color: rgba(250, 248, 244, 0.32);
}
.nav-btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
}

/* ─── Top Progress Bar ────────────────────────────────────────────────────── */
.top-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3.5px;
  background: var(--text-primary);
  z-index: 105;
  transition: width 0.4s ease;
}

/* ─── Keyboard Overlay ────────────────────────────────────────────────────── */
.kbd-overlay {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(250, 248, 244, 0.65);
  background: rgba(22, 20, 19, 0.92);
  padding: 0.3rem 0.9rem;
  border-radius: 20px;
  border: 1px solid rgba(250, 248, 244, 0.12);
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 99;
}
.kbd-overlay kbd {
  background: rgba(250, 248, 244, 0.15);
  padding: 1px 6px;
  border-radius: 4px;
  color: #ffffff;
}

/* ─── Grids & Spacing (1.5 Spacing Standard) ──────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.8rem; width: 100%; max-width: 1240px; align-items: center; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%; max-width: 1240px; }
.col-flex { display: flex; flex-direction: column; gap: 1.1rem; }
.row-flex { display: flex; align-items: center; gap: 1.2rem; }

/* ─── Member Card ─────────────────────────────────────────────────────────── */
.member-card {
  overflow: hidden;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}
.member-img-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  position: relative;
}
.member-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.member-info {
  padding: 1.35rem;
  line-height: var(--line-height-std);
}
.member-name { font-size: 1.2rem; font-weight: 800; color: var(--text); line-height: var(--line-height-std); }
.member-role { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; line-height: var(--line-height-std); }
.member-nim { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); margin-top: 0.4rem; line-height: var(--line-height-std); }

/* ─── Stat Box ────────────────────────────────────────────────────────────── */
.stat-highlight-box {
  padding: 1.25rem 1.5rem;
  border-radius: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  line-height: var(--line-height-std);
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="top-progress" id="topProgressBar" style="width: 0%"></div>

<div class="deck-viewport">
  <div class="slider-track" id="sliderTrack"></div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <div class="nav-brand">
    <div class="nav-brand-logo">
      <i class="ph-fill ph-shield-check"></i>
    </div>
    <div>
      <span class="nav-brand-title">Verifin</span>
      <span style="font-size: 11px; color: #9e968b; margin-left: 6px;">| GEMASTIK XIX 2026</span>
    </div>
  </div>

  <div class="nav-controls">
    <span class="nav-counter" id="slideCounter">01 / 15</span>
    <button class="nav-btn" id="btnPrev" title="Slide Sebelumnya (←)">
      <i class="ph-bold ph-caret-left"></i>
    </button>
    <button class="nav-btn" id="btnNext" title="Slide Selanjutnya (→ / Spasi)">
      <i class="ph-bold ph-caret-right"></i>
    </button>
    <button class="nav-btn" id="btnFullscreen" title="Fullscreen (F)">
      <i class="ph-bold ph-corners-out"></i>
    </button>
  </div>
